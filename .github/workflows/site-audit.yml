name: Site audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Start server
        run: |
          bun run start &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "server did not start" && exit 1

      - name: SEO and metadata audit
        run: node scripts/site-audit.mjs

      - name: Lighthouse budgets
        run: |
          npx --yes lighthouse http://127.0.0.1:3000/ \
            --quiet --chrome-flags="--headless --no-sandbox" \
            --preset=desktop \
            --output=json --output-path=./lighthouse-home.json \
            --only-categories=performance,accessibility,best-practices,seo
          node -e '
            const report = require("./lighthouse-home.json");
            const scores = Object.fromEntries(
              Object.entries(report.categories).map(([key, value]) => [key, value.score])
            );
            console.log("Lighthouse scores:", JSON.stringify(scores));
            // Desktop preset: shared-runner mobile throttling is too noisy to
            // gate on (observed 0.65 on a clean build). Tighten once a few
            // runner scores are observed.
            const budgets = { performance: 0.8, accessibility: 0.95, "best-practices": 0.9, seo: 0.95 };
            const failures = Object.entries(budgets).filter(([key, min]) => (scores[key] ?? 0) < min);
            if (failures.length) {
              console.error("Budget failures:", JSON.stringify(failures));
              process.exit(1);
            }
          '
